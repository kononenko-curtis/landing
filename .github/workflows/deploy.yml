name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_HOST: kononenko.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches type and template errors here rather than shipping a broken
      # page to the server.
      - name: Type check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Install deploy tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

      # Scanning the live host is the authoritative source: those are the keys
      # that must match at connect time. DEPLOY_KNOWN_HOSTS is appended as an
      # extra pin when set, never used as the only source — a truncated or
      # mistyped paste there must not be able to break the deploy.
      - name: Trust the server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          keys=$(grep -cE '^[^#[:space:]]' ~/.ssh/known_hosts || true)
          echo "known_hosts key lines: ${keys}"
          if [ "${keys:-0}" -eq 0 ]; then
            echo "::error::no host key could be obtained for the server"
            exit 1
          fi

      # sshpass -e reads the password from $SSHPASS. The -p form would expose it
      # in the process list to every other step on the runner.
      - name: Provision server (nginx + web root)
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' SERVER_NAME='${SITE_HOST}' CERTBOT_EMAIL='${{ secrets.CERTBOT_EMAIL }}' bash -s" \
            < deploy/provision.sh

      # Trailing slash on dist/ matters: without it rsync would create
      # <DEPLOY_PATH>/dist/ instead of writing into DEPLOY_PATH itself.
      - name: Upload site
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e rsync -rlvz --delete --chmod=D755,F644 \
            -e "ssh -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # The only proof the deploy worked: Claude Code sessions cannot reach the
      # server, so this step's output is the record.
      - name: Verify the site responds over HTTPS
        run: |
          served=0
          for attempt in $(seq 1 6); do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 15 "https://${SITE_HOST}/" || echo 000)
            echo "attempt ${attempt}: https -> HTTP ${code}"
            if [ "$code" = "200" ]; then
              served=1
              break
            fi
            sleep 5
          done
          if [ "$served" != "1" ]; then
            echo "::error::https://${SITE_HOST}/ never returned 200"
            exit 1
          fi

          echo "--- certificate ---"
          curl -sS -o /dev/null --max-time 15 -w 'issuer: %{ssl_verify_result} (0 = verified)\n' "https://${SITE_HOST}/"

          redirect=$(curl -sS -o /dev/null --max-time 15 -w '%{http_code} %{redirect_url}' "http://${SITE_HOST}/" || echo '000 -')
          echo "http -> ${redirect}"
          case "$redirect" in
            30[128]" https://"*) ;;
            *)
              echo "::error::http://${SITE_HOST}/ does not redirect to https (got: ${redirect})"
              exit 1
              ;;
          esac

          echo "--- served page, first lines ---"
          head -n 12 /tmp/page.html
